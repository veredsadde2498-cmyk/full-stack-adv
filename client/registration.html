<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Join Vefinance | Create Account</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body class="auth-page">
    <div class="auth-container">
        <div class="auth-logo">
            <span class="logo-text">Ve<span class="logo-accent">finance</span></span>
        </div>
        <div class="auth-card">
            <h2>Create Account</h2>
            <p>Start managing your global business expenses today.</p>
            <form action="login.html">
                <div class="form-group">
                    <label>Full Name</label>
                    <input type="text" placeholder="e.g. Daniel Levi" required>
                </div>
                <div class="form-group">
                    <label>Company Name</label>
                    <input type="text" placeholder="e.g. Acme Corp" required>
                </div>
                <div class="form-group">
                    <label>Email Address</label>
                    <input type="email" placeholder="name@company.com" required>
                </div>
                <div class="form-group">
                    <label>Password</label>
                    <input type="password" placeholder="At least 8 characters" required>
                </div>
                <button type="submit" class="btn-primary btn-block">Sign Up</button>
            </form>
            <div class="auth-footer">
                Already have an account? <a href="login.html">Sign in</a>
            </div>
        </div>
    </div>
</body>
</html>
