<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard | Vefinance</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>
    <div class="app-container">
        <aside class="sidebar">
            <div class="logo">
                <span class="logo-text">Ve<span class="logo-accent">finance</span></span>
            </div>
            <nav>
                <ul>
                    <li class="active"><i class="fas fa-th-large"></i> Dashboard</li>
                    <li><i class="fas fa-wallet"></i> Expenses</li>
                    <li><i class="fas fa-building"></i> Company</li>
                    <li class="nav-sep"></li>
                    <li><i class="fas fa-sign-out-alt"></i> Logout</li>
                </ul>
            </nav>
        </aside>

        <main class="main-content">
            <header>
                <div>
                    <h1>Welcome, <span class="placeholder">{user_name}</span></h1>
                    <p>Managing: <strong>{company_name}</strong></p>
                </div>
                <button class="btn-primary" onclick="window.location.href='add-expense.html'">+ Add Expense</button>
            </header>

            <div class="rates-bar">
                <div class="rate-item">USD/ILS: <strong>{rate_usd}</strong></div>
                <div class="rate-item">EUR/ILS: <strong>{rate_eur}</strong></div>
                <div class="live-tag"><span class="dot"></span> Market Live</div>
            </div>

            <section class="stats-grid">
                <div class="stat-card">
                    <label>Monthly Spending</label>
                    <div class="value">₪{total_spent}</div>
                </div>
                <div class="stat-card">
                    <label>Active Subs</label>
                    <div class="value">{sub_count}</div>
                </div>
                <div class="stat-card highlight">
                    <label>Next Bill</label>
                    <div class="value">{next_vendor}</div>
                </div>
            </section>

            <section class="table-section">
                <h2>Recent Transactions</h2>
                <table class="ve-table">
                    <thead>
                        <tr>
                            <th>Vendor</th>
                            <th>Date</th>
                            <th>Amount</th>
                            <th>Status</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr>
                            <td colspan="4" class="empty-row">No data for {company_name}</td>
                        </tr>
                    </tbody>
                </table>
            </section>
        </main>
    </div>
</body>
</html>
