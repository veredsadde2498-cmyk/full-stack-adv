<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | Vefinance</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body class="auth-page">
    <div class="auth-container">
        <div class="auth-logo">
            <span class="logo-text">Ve<span class="logo-accent">finance</span></span>
        </div>
        <div class="auth-card">
            <h2>Welcome Back</h2>
            <p>Sign in to access your dashboard.</p>
            <form>
                <div class="form-group">
                    <label>Email Address</label>
                    <input type="email" placeholder="name@company.com" required>
                </div>
                <div class="form-group">
                    <label>Password</label>
                    <input type="password" placeholder="••••••••" required>
                </div>
                <button type="button" class="btn-primary btn-block" onclick="window.location.href='index.html'">Sign In</button>
            </form>
            <div class="auth-footer">
                New to Vefinance? <a href="registration.html">Create an account</a>
            </div>
        </div>
    </div>
</body>
</html>
